<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0}

.app{display:flex;min-height:100vh}

main{flex:1;min-width:0;padding:18px;padding-bottom:70px}
.topbar{display:none}
header.head{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;text-align:center}
header.head input.school{width:100%;max-width:520px;text-align:center;font-size:19px;font-weight:700;border:1px dashed var(--line);border-radius:10px;padding:8px;background:transparent}
header.head .tp{margin-top:6px;font-weight:600;letter-spacing:.4px;color:var(--menu)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:17px;color:var(--menu)}
.card h3{margin:16px 0 8px;font-size:15px;color:var(--menu)}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea{min-height:80px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>div{flex:1 1 160px;min-width:140px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--menu);color:#fff;border:0;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;width:auto}
.btn:hover{background:var(--menu-soft)}
.btn.sec{background:#fff;color:var(--menu);border:1px solid var(--menu)}
.btn.warn{background:#9b1c2e}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
th{background:#f0ece2;color:var(--menu);position:sticky;top:0;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}
.t-Ringan{background:var(--ringan)}.t-Sedang{background:var(--sedang)}.t-Berat{background:var(--berat)}.t-SangatBerat{background:var(--sberat)}.t-Terlambat{background:#0e7490}.t-Manual{background:#6b7280}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:24px;color:var(--menu)}
.stat span{font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.chart{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.bar-row{display:grid;grid-template-columns:minmax(90px,34%) 1fr 56px;gap:8px;align-items:center;font-size:13px}
.bar-lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-tr{background:#e7e2d6;border-radius:999px;height:14px;overflow:hidden}
.bar-fl{height:100%;background:var(--menu);border-radius:999px;min-width:2px}
.bar-vl{text-align:right;font-weight:700}

 body.pdet #view>*:not(#detPrint),body.pdet .head{display:none!important}

var GH_DEF={owner:"",repo:"",branch:"main",path:"data-pelanggaran.json"};
function ghCfg(){var c={};try{c=JSON.parse(localStorage.getItem(GKEY)||"{}")||{}}catch(e){}
  return {owner:c.owner||GH_DEF.owner,repo:c.repo||GH_DEF.repo,branch:c.branch||GH_DEF.branch,path:c.path||GH_DEF.path}}
function ghReady(c){return c.owner&&c.repo&&c.path}
function getGhCfg(){
  var c=ghCfg();if(ghReady(c)||!navigator.onLine)return Promise.resolve(c);
  /* sekali saja: ambil lokasi repo (data kecil) lalu disimpan permanen di perangkat */
  return withTimeout(fetch(FB+"/gh.json").then(function(r){return r.json()}),8000).then(function(g){
    if(g&&g.owner){localStorage.setItem(GKEY,JSON.stringify(g));return ghCfg()}return c}).catch(function(){return c});
}
function b64utf8(str){var b=new TextEncoder().encode(str),out="";for(var i=0;i<b.length;i+=0x8000)out+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(out)}
function pullViewer(){
  getGhCfg().then(function(c){
    if(!ghReady(c)){setSync("Repositori GitHub belum diatur – data lokal");return}
    var url="https://raw.githubusercontent.com/"+c.owner+"/"+c.repo+"/"+c.branch+"/"+c.path.split("/").map(encodeURIComponent).join("/")+"?t="+Date.now();
    return withTimeout(fetch(url,{cache:"no-store"}),15000).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(remote){
      remote=normalize(remote&&remote.data&&remote.students==null?remote.data:remote);
      if((remote.updatedAt||0)!==(db.updatedAt||0)||legacyLocal){db=remote;legacyLocal=false;localStorage.setItem(KEY,JSON.stringify(db));render()}
      setSync("Tersinkron (GitHub) "+stamp());
    });
  }).catch(function(){setSync("Gagal memuat dari GitHub – data lokal")});
}
function pull(){
  if(!ROLE)return;
  if(!navigator.onLine){setSync("Offline – data lokal");return}
  if(ROLE==="viewer"){setSync("Memuat...");pullViewer();return}
  pushPw();
  if(localStorage.getItem(DKEY)&&ROLE==="admin"){push();return}
  setSync("Memeriksa pembaruan...");
  /* Hemat read: cek dulu penanda waktu kecil (meta). Data penuh hanya diunduh bila ada perubahan. */
  withTimeout(fetch(FB+"/meta/updatedAt.json"),10000).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(mt){
    if(mt&&!legacyLocal&&db.updatedAt&&mt===db.updatedAt){setSync("Tersinkron online "+stamp()+" (tidak ada perubahan)");return}
    if(mt&&!legacyLocal&&db.updatedAt&&mt<db.updatedAt){push();return}
    pullFull();
  }).catch(function(){setSync("Gagal terhubung – data lokal")});
}
function pullFull(){
  withTimeout(fetch(FB+"/data.json"),15000).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(remote){
    if(!remote){
      if(hasData(db)&&ROLE==="admin"){if(!db.updatedAt)db.updatedAt=Date.now();save()}
      else setSync("Online (database online masih kosong)");
      return;
    }
    remote=normalize(remote);
    if(legacyLocal&&hasData(db)){
      if(ROLE!=="admin"){db=remote;setSync("Menampilkan data online");render();return}
      var useOnline=confirm("Ditemukan data lokal lama di perangkat ini dan data di database online.\n\nOK = gunakan data ONLINE (data lokal tetap tersimpan di autobackup)\nBatal = gunakan data LOKAL dan unggah ke online");
      if(useOnline){try{localStorage.setItem(BKEY,JSON.stringify({at:new Date().toISOString(),data:db}))}catch(e){}
        db=remote;legacyLocal=false;localStorage.setItem(KEY,JSON.stringify(db));setSync("Tersinkron online "+stamp());render()}
      else save();
      return;
    }
    if((remote.updatedAt||0)>(db.updatedAt||0)){
      db=remote;localStorage.setItem(KEY,JSON.stringify(db));render();
      if(db.updatedAt)fetch(FB+"/meta.json",{method:"PUT",body:JSON.stringify({updatedAt:db.updatedAt})}).catch(function(){});
    }else if((remote.updatedAt||0)<(db.updatedAt||0)&&ROLE==="admin"){push();return}
    setSync("Tersinkron online "+stamp());
  }).catch(function(){setSync("Gagal terhubung – data lokal")});
}
function sha(s){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(WM_KEY+"|"+s)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,"0")}).join("");
  });
}
function getAdminHash(){
  var local=localStorage.getItem(AKEY)||H_DEF;
  if(!navigator.onLine||localStorage.getItem(AKEY_P))return Promise.resolve(local);
  return withTimeout(fetch(FB+"/auth/adminHash.json").then(function(r){return r.json()}),5000).then(function(h){
    if(typeof h==="string"&&h.length===64){localStorage.setItem(AKEY,h);return h}
    return local;
  }).catch(function(){return local});
}
function setAdminPw(p){
  sha(p).then(function(h){localStorage.setItem(AKEY,h);localStorage.setItem(AKEY_P,h);pushPw()});
}

var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function todayISO(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function tpOf(dateStr){
  var d=dateStr?new Date(dateStr+"T00:00:00"):new Date();
  if(isNaN(d)) d=new Date();
  var y=d.getFullYear(), m=d.getMonth()+1;
  return m>=7 ? y+"/"+(y+1) : (y-1)+"/"+y;
}
function catClass(c){return "t-"+c.replace(/\s/g,"")}
function confirm2(msg){
  if(!confirm(msg)) return false;
  return confirm("KONFIRMASI KEDUA:\n"+msg+"\n\nTindakan ini tidak dapat dibatalkan. Lanjutkan?");
}
function splitLine(l){return l.split(/[;,\t]+/).map(function(s){return s.trim()})}
function classes(){
  var s={};db.students.forEach(function(x){s[x.kelas]=1});
  return Object.keys(s).sort(function(a,b){return a.localeCompare(b,"id",{numeric:true})});
}
function poinOf(rec){
  if(rec.vid){var v=db.violations.find(function(x){return x.id===rec.vid});if(v) return v.poin;}
  return rec.poin||0;
}
function namaOf(rec){
  if(rec.vid){var v=db.violations.find(function(x){return x.id===rec.vid});if(v) return v.nama;}
  return rec.nama||"(pelanggaran dihapus)";
}
function catOf(rec){
  if(rec.telat)return "Ringan";
  if(rec.vid){var v=db.violations.find(function(x){return x.id===rec.vid});if(v) return v.cat;}
  return rec.cat||"Manual";
}
function stud(id){return db.students.find(function(s){return s.id===id})}
function totalPoin(sid){
  return db.records.filter(function(r){return r.studentId===sid}).reduce(function(a,r){return a+poinOf(r)},0);
}
function download(name,content,mime){
  var b=new Blob([content],{type:mime});var u=URL.createObjectURL(b);
  var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500);
}
function exportXls(name,title,head,rows){
  var h="<table border='1'><tr><th colspan='"+head.length+"'>"+esc(title)+"</th></tr><tr>"+
    head.map(function(x){return "<th>"+esc(x)+"</th>"}).join("")+"</tr>";
  rows.forEach(function(r){h+="<tr>"+r.map(function(c){return "<td>"+esc(c)+"</td>"}).join("")+"</tr>"});
  h+="</table>";
  var html="<html xmlns:x='urn:schemas-microsoft-com:office:excel'><head><meta charset='utf-8'></head><body>"+h+"</body></html>";
  download(name+".xls","\ufeff"+html,"application/vnd.ms-excel;charset=utf-8");
}

function sortAbsen(){
  var groups={};db.students.forEach(function(s){(groups[s.kelas]=groups[s.kelas]||[]).push(s)});
  Object.keys(groups).forEach(function(k){
    groups[k].sort(function(a,b){return a.nama.localeCompare(b.nama,"id")}).forEach(function(s,i){s.absen=i+1});
  });
  db.students.sort(function(a,b){return a.kelas.localeCompare(b.kelas,"id",{numeric:true})||(a.absen-b.absen)});
  save();
}
function moveStudent(id,dir){
  var s=db.students.find(function(x){return x.id===id});if(!s)return;
  var grp=db.students.filter(function(x){return x.kelas===s.kelas});
  grp.forEach(function(x,i){if(!x.absen)x.absen=i+1});
  grp.sort(function(a,b){return a.absen-b.absen});
  var i=grp.indexOf(s), j=i+dir;
  if(j<0||j>=grp.length)return;
  var t=grp[j].absen;grp[j].absen=s.absen;s.absen=t;
  db.students.sort(function(a,b){return a.kelas.localeCompare(b.kelas,"id",{numeric:true})||(a.absen-b.absen)});
  save();render();
}

    var nama=(p[0]||"").toLowerCase();

function barGroup(title,items){

    return '<div class="bar-row"><div class="bar-lb">'+esc(String(x[0]))+'</div>'+
    '<div class="bar-tr"><div class="bar-fl" style="width:'+Math.round(x[1]/max*100)+'%"></div></div>'+
    '<div class="bar-vl">'+x[1]+'</div></div>';
  }).join("")+'</div>':'<p class="muted">Belum ada data.</p>');
}
function chartsHTML(rows,perArr){
  var byCat={},byKelas={},byTgl={};
  rows.forEach(function(r){
    var s=stud(r.studentId), p=poinOf(r);
    byCat[catOf(r)]=(byCat[catOf(r)]||0)+p;
    byKelas[s.kelas||"-"]=(byKelas[s.kelas||"-"]||0)+p;
    byTgl[r.tanggal]=(byTgl[r.tanggal]||0)+p;
  });
  function arr(o,sortKey){
    var a=Object.keys(o).map(function(k){return [k,o[k]]});
    return sortKey?a.sort(function(x,y){return String(x[0]).localeCompare(String(y[0]))}):a.sort(function(x,y){return y[1]-x[1]});
  }
  var cats=ALLCATS.filter(function(c){return byCat[c]}).map(function(c){return [c,byCat[c]]});
  var tgl=arr(byTgl,true).slice(-14);
  var top=perArr.slice(0,10).map(function(x){return [x.s.nama+" ("+(x.s.kelas||"-")+")",x.p]});
  return '<div class="card"><h2>Grafik Pelanggaran</h2>'+
    barGroup("Total Poin per Kategori",cats)+
    barGroup("Total Poin per Kelas",arr(byKelas))+
    barGroup("Poin per Tanggal (14 terakhir)",tgl)+
    barGroup("10 Siswa Poin Tertinggi",top)+'</div>';
}
function weekKey(iso){
  var d=new Date(iso+"T00:00:00");if(isNaN(d))return iso;
  var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);
  var m=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  return d.getDate()+" "+m[d.getMonth()]+" "+d.getFullYear();
}
function lineChartHTML(recs,mode,nama,d1,d2,zoom){
  if(!recs.length&&!(d1&&d2))return '<p class="muted">Tidak ada pelanggaran pada filter ini.</p>';
  zoom=zoom||1;
  var g={};
  recs.forEach(function(r){
    var sortK=mode==="mingguan"?weekKeyISO(r.tanggal):r.tanggal.slice(0,7);
    g[sortK]=g[sortK]||{p:0,n:0};g[sortK].p+=poinOf(r);g[sortK].n++;
  });
  var start=d1||(recs.length?recs[0].tanggal:todayISO()), end=d2||todayISO();
  if(recs.length&&!d2&&recs[recs.length-1].tanggal>end)end=recs[recs.length-1].tanggal;
  if(end<start){var tmp=start;start=end;end=tmp}
  var BL=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  var arr=[],guard=0;
  if(mode==="mingguan"){
    var c=new Date(weekKeyISO(start)+"T00:00:00"),e=new Date(end+"T00:00:00");
    while(c<=e&&guard++<2000){var iso=c.getFullYear()+"-"+String(c.getMonth()+1).padStart(2,"0")+"-"+String(c.getDate()).padStart(2,"0");
      var v=g[iso]||{p:0,n:0};arr.push({label:weekKey(iso),p:v.p,n:v.n});c.setDate(c.getDate()+7);}
  }else{
    var y=+start.slice(0,4),m=+start.slice(5,7),ey=+end.slice(0,4),em=+end.slice(5,7);
    while((y<ey||(y===ey&&m<=em))&&guard++<2000){var k=y+"-"+String(m).padStart(2,"0");
      var v2=g[k]||{p:0,n:0};arr.push({label:BL[m-1]+" "+y,p:v2.p,n:v2.n});m++;if(m>12){m=1;y++}}
  }
  var max=arr.reduce(function(m,x){return Math.max(m,x.p)},0)||1;
  var judul=mode==="mingguan"?"Mingguan (mulai Senin)":"Bulanan";
  var W=Math.round(Math.max(600,arr.length*70)*zoom),H=260,pl=40,pr=30,pt=24,pb=50,iw=W-pl-pr,ih=H-pt-pb;
  var X=function(i){return pl+(arr.length===1?iw/2:i*iw/(arr.length-1))},Y=function(v){return pt+ih-v/max*ih};
  var grid="";for(var gi=0;gi<=4;gi++){var gv=Math.round(max*gi/4),gy=Y(max*gi/4);grid+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="#e5e0d4"/><text x="'+(pl-6)+'" y="'+(gy+4)+'" font-size="11" text-anchor="end" fill="#6b7280">'+gv+'</text>'}
  var pts=arr.map(function(x,i){return X(i)+","+Y(x.p)}).join(" ");
  var dots=arr.map(function(x,i){return '<circle cx="'+X(i)+'" cy="'+Y(x.p)+'" r="5" fill="#203d46"><title>'+esc(x.label)+': '+x.p+' poin / '+x.n+'x</title></circle>'+
    '<text x="'+X(i)+'" y="'+(Y(x.p)-10)+'" font-size="11" text-anchor="middle" fill="#203d46" font-weight="700">'+x.p+'</text>'+
    '<text x="'+X(i)+'" y="'+(H-pb+18)+'" font-size="10" text-anchor="middle" fill="#374151">'+esc(x.label)+'</text>'+
    '<text x="'+X(i)+'" y="'+(H-pb+32)+'" font-size="10" text-anchor="middle" fill="#6b7280">'+x.n+'x</text>'}).join("");
  var zb='<div class="btns" style="align-items:center"><button class="btn sm sec" id="dZo" title="Perkecil">➖ Zoom Out</button><span class="muted">'+Math.round(zoom*100)+'%</span><button class="btn sm sec" id="dZi" title="Perbesar">➕ Zoom In</button><button class="btn sm sec" id="dZf">Sesuaikan Layar</button><button class="btn sm sec" id="dZr">100%</button></div>';
  return '<h3>Grafik '+judul+' — '+esc(nama||"")+'</h3>'+zb+'<div id="dChartBox" style="overflow-x:auto"><svg data-basew="'+Math.round(Math.max(600,arr.length*70))+'" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="max-width:none;background:#fffdfa">'+grid+
    '<polyline points="'+pts+'" fill="none" stroke="#203d46" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'</svg></div>'+
    '<p class="muted">Angka di atas titik = total poin; di bawah label = jumlah pelanggaran.</p>';
}

function weekKeyISO(iso){
  var d=new Date(iso+"T00:00:00");if(isNaN(d))return iso;
  var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

  on("#rst","change",function(){

    rd.onload=function(){
      try{var d=JSON.parse(rd.result);
        if(!d||typeof d!=="object")throw 0;
        if(!confirm2("Restore data dari file ini? Data saat ini akan diganti."))return;
        db=Object.assign(fresh(),d);save();render();toast("Restore berhasil.");
      }catch(e){toast("File tidak valid.")}
    };rd.readAsText(f);
  });
  on("#mrg","change",function(){
    var files=Array.prototype.slice.call(this.files||[]);if(!files.length)return;
    Promise.all(files.map(function(f){return f.text().then(function(t){try{return {n:f.name,d:JSON.parse(t)}}catch(e){return {n:f.name,d:null}}})})).then(function(list){
      if(!confirm2("Gabungkan "+files.length+" file backup ke data saat ini?"))return;
      var norm=function(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ")};
      var sKey=function(s){return s.nisn?"n:"+String(s.nisn).trim():"k:"+norm(s.nama)+"|"+norm(s.kelas)};
      var vKey=function(v){return norm(v.cat)+"|"+norm(v.nama)};
      var sMap={},vMap={};db.students.forEach(function(s){sMap[sKey(s)]=s});db.violations.forEach(function(v){vMap[vKey(v)]=v});
      var vById={};db.violations.forEach(function(v){vById[v.id]=v});
      var rKey=function(r){var v=r.vid?vById[r.vid]:null;return r.studentId+"|"+r.tanggal+"|"+norm(v?v.cat+"|"+v.nama:(r.cat||"")+"|"+(r.nama||""))+"|"+(r.jamDatang||"")};
      var rMap={};db.records.forEach(function(r){rMap[rKey(r)]=r});
      var st={s:0,v:0,r:0,dup:0,bad:[]};
      list.forEach(function(it){
        var d=it.d;if(!d||!Array.isArray(d.students)||!Array.isArray(d.records)){st.bad.push(it.n);return}
        var sid={},vid={};
        d.students.forEach(function(s){var k=sKey(s),e=sMap[k];
          if(!e){e=Object.assign({},s,{id:uid()});db.students.push(e);sMap[k]=e;st.s++}
          else{["nisn","jk","kelas"].forEach(function(f){if(!e[f]&&s[f])e[f]=s[f]})}
          sid[s.id]=e.id});
        (d.violations||[]).forEach(function(v){var k=vKey(v),e=vMap[k];
          if(!e){e=Object.assign({},v,{id:uid()});db.violations.push(e);vMap[k]=e;vById[e.id]=e;st.v++}
          vid[v.id]=e.id});
        d.records.forEach(function(r){if(!sid[r.studentId])return;
          var n=Object.assign({},r,{id:uid(),studentId:sid[r.studentId],vid:r.vid?(vid[r.vid]||null):null});
          if(r.vid&&!n.vid)return;
          var k=rKey(n),e=rMap[k];
          if(e){if(!e.catatan&&n.catatan)e.catatan=n.catatan;st.dup++;return}
          db.records.push(n);rMap[k]=n;st.r++});
        if(!db.school&&d.school)db.school=d.school;
      });
      save();render();
      var html='<div class="card" style="margin-top:10px"><b>Hasil penggabungan:</b><br>Siswa baru: '+st.s+'<br>Jenis pelanggaran baru: '+st.v+'<br>Catatan baru: '+st.r+'<br>Catatan sama (dilewati): '+st.dup+(st.bad.length?'<br>File tidak valid: '+esc(st.bad.join(", ")):"")+'</div>';
      var el=$("#mrgRes");if(el)el.innerHTML=html;toast("Penggabungan selesai.");
    });
  });
  on("#shareBk","click",function(){
    var name="backup-pelanggaran-"+todayISO()+".json",txt=JSON.stringify(db,null,2);
    var f=null;try{f=new File([txt],name,{type:"application/json"})}catch(e){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:"Backup Data Pelanggaran",text:"Backup data pelanggaran "+todayISO()}).catch(function(){});
    }else{download(name,txt,"application/json");toast("Perangkat/browser tidak mendukung share file. File backup diunduh, silakan kirim manual.")}
  });
  on("#ghSave","click",function(){
    var c={owner:$("#ghO").value.trim(),repo:$("#ghR").value.trim(),branch:$("#ghB").value.trim()||"main",path:$("#ghP").value.trim().replace(/^\/+/,"")};
    var tk=$("#ghT").value.trim(),res=$("#ghRes");
    if(!ghReady(c)||!tk)return toast("Lengkapi owner, repositori, path dan token.");
    localStorage.setItem(GKEY,JSON.stringify(c));localStorage.setItem(TKEY,tk);
    fetch(FB+"/gh.json",{method:"PUT",body:JSON.stringify(c)}).catch(function(){});
    var api="https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+c.path.split("/").map(encodeURIComponent).join("/");
    var H={"Authorization":"Bearer "+tk,"Accept":"application/vnd.github+json"};
    res.textContent="Menyimpan ke GitHub...";
    fetch(api+"?ref="+encodeURIComponent(c.branch),{headers:H,cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(ex){
      var body={message:"Update data pelanggaran "+new Date().toLocaleString("id-ID"),content:b64utf8(JSON.stringify(db)),branch:c.branch};
      if(ex&&ex.sha)body.sha=ex.sha;
      return fetch(api,{method:"PUT",headers:H,body:JSON.stringify(body)});
    }).then(function(r){return r.json().then(function(j){if(!r.ok)throw (j&&j.message)||r.status;return j})}).then(function(){
      res.textContent="Berhasil disimpan ke GitHub "+stamp();toast("JSON berhasil disimpan ke GitHub.");
    }).catch(function(e){res.textContent="Gagal: "+e;toast("Gagal menyimpan ke GitHub: "+e)});
  });
  on("#ab","change",function(){db.settings.autobackup=this.checked;save();render()});
  on("#abDl","click",function(){
    var s=localStorage.getItem(BKEY);if(!s)return toast("Belum ada autobackup.");
    download("autobackup-"+todayISO()+".json",s,"application/json");
  });
  on("#abRes","click",function(){
    var s=localStorage.getItem(BKEY);if(!s)return toast("Belum ada autobackup.");
    if(!confirm2("Pulihkan data dari autobackup terakhir?"))return;
    db=Object.assign(fresh(),JSON.parse(s).data);save();render();
  });
  on("#dRec","click",function(){if(confirm2("Hapus SEMUA catatan pelanggaran siswa?")){db.records=[];save();render()}});
  on("#dStu","click",function(){if(confirm2("Hapus SEMUA data siswa dan catatannya?")){db.students=[];db.records=[];save();render()}});
  on("#dViol","click",function(){if(confirm2("Hapus SEMUA jenis pelanggaran?")){db.violations=[];save();render()}});
  on("#dAll","click",function(){
    if(!confirm2("RESET APLIKASI: seluruh data (sekolah, siswa, pelanggaran, catatan) akan dikembalikan ke format awal."))return;
    db=fresh();save();state={kelas:"",cari:"",tanggal:todayISO(),rekap:{d1:"",d2:"",kelas:"",cat:"",cari:""}};page="dash";render();
  });
}

/* modal actions */
$("#modalBox").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="closeM"){closeModal();return}
  if(b.id==="saveViol"){
    var sid=b.dataset.s, note=$("#vNote").value.trim(), n=0;
    Array.prototype.forEach.call(document.querySelectorAll("#vList input[type=checkbox]:checked"),function(cb){
      db.records.push({id:uid(),studentId:sid,tanggal:state.tanggal,vid:cb.value,catatan:note});n++;
    });
    var mn=$("#mN").value.trim(), mp=parseInt($("#mP").value||"0",10)||0;
    if(mn){db.records.push({id:uid(),studentId:sid,tanggal:state.tanggal,vid:null,nama:mn,poin:mp,cat:"Manual",catatan:note});n++}
    if(!n)return toast("Pilih minimal satu pelanggaran atau isi pelanggaran manual.");
    save();closeModal();render();toast(n+" pelanggaran tersimpan.");
  }
  if(b.id==="saveStud"){
    var s=stud(b.dataset.s);if(!s)return;
    s.kelas=$("#eK").value.trim();s.nama=$("#eN").value.trim();s.nisn=$("#eI").value.trim();s.jk=$("#eJ").value;
    s.absen=parseInt($("#eA").value||"0",10)||0;save();closeModal();render();
  }
  if(b.id==="saveVio"){
    var vv=db.violations.find(function(x){return x.id===b.dataset.v});if(!vv)return;
    vv.nama=$("#evN").value.trim();vv.poin=parseInt($("#evP").value||"0",10)||0;vv.cat=$("#evC").value;
    save();closeModal();render();toast("Poin diperbarui, total poin siswa ikut menyesuaikan.");
  }
  if(b.id==="saveTelat"){
    var rt=db.records.find(function(x){return x.id===b.dataset.r});if(!rt)return;
    rt.tanggal=$("#etT").value||rt.tanggal;rt.jamMasuk=$("#etM").value||"07:00";rt.jamDatang=$("#etD").value||rt.jamDatang;
    rt.poin=parseInt($("#etP").value||"0",10)||0;rt.catatan=$("#etN").value.trim();rt.menit=menitTelat(rt);
    save();closeModal();render();toast("Data terlambat diperbarui.");
    return;
  }
  if(b.id==="saveTelatBaru"){simpanTelatBaru(b.dataset.s);return}
  if(b.id==="saveRec"){
    var r=db.records.find(function(x){return x.id===b.dataset.r});if(!r)return;
    r.tanggal=$("#erT").value;r.catatan=$("#erN").value.trim();
    var sel=$("#erV").value;
    if(sel==="__manual"){r.vid=null;r.nama=$("#erM").value.trim()||namaOf(r);r.poin=parseInt($("#erP").value||"0",10)||0;r.cat="Manual"}
    else {r.vid=sel;delete r.nama;delete r.poin;delete r.cat}
    save();closeModal();render();
  }
});
function editStudent(id){
  var s=stud(id);if(!s)return;
  openModal('<h2 style="margin-top:0;color:var(--menu)">Edit Siswa</h2><div class="row">'+
  '<div><label class="f">Absen</label><input id="eA" type="number" value="'+(s.absen||0)+'"></div>'+
  '<div><label class="f">Kelas</label><input id="eK" value="'+esc(s.kelas)+'"></div>'+
  '<div style="flex:2 1 200px"><label class="f">Nama</label><input id="eN" value="'+esc(s.nama)+'"></div>'+
  '<div><label class="f">NISN</label><input id="eI" value="'+esc(s.nisn)+'"></div>'+
  '<div><label class="f">JK</label><select id="eJ"><option '+(s.jk==="L"?"selected":"")+'>L</option><option '+(s.jk==="P"?"selected":"")+'>P</option></select></div>'+
  '</div><div class="btns"><button class="btn" id="saveStud" data-s="'+id+'">Simpan</button><button class="btn sec" id="closeM">Batal</button></div>');
}
function editViol(id){
  var v=db.violations.find(function(x){return x.id===id});if(!v)return;
  openModal('<h2 style="margin-top:0;color:var(--menu)">Edit Pelanggaran</h2><div class="row">'+
  '<div><label class="f">Kategori</label><select id="evC">'+CATS.map(function(c){return '<option '+(v.cat===c?"selected":"")+'>'+c+'</option>'}).join("")+'</select></div>'+
  '<div style="flex:2 1 200px"><label class="f">Nama</label><input id="evN" value="'+esc(v.nama)+'"></div>'+
  '<div><label class="f">Poin</label><input id="evP" type="number" value="'+v.poin+'"></div></div>'+
  '<div class="btns"><button class="btn" id="saveVio" data-v="'+id+'">Simpan</button><button class="btn sec" id="closeM">Batal</button></div>');
}
function editRecord(id){
  var r=db.records.find(function(x){return x.id===id});if(!r)return;
  var opts=db.violations.map(function(v){return '<option value="'+v.id+'" '+(r.vid===v.id?"selected":"")+'>['+v.cat+'] '+esc(v.nama)+' ('+v.poin+')</option>'}).join("");
  openModal('<h2 style="margin-top:0;color:var(--menu)">Edit Catatan Pelanggaran</h2>'+
  '<label class="f">Tanggal</label><input type="date" id="erT" value="'+r.tanggal+'">'+
  '<label class="f" style="margin-top:8px">Pelanggaran</label><select id="erV">'+opts+
  '<option value="__manual" '+(!r.vid?"selected":"")+'>-- Manual --</option></select>'+
  '<div class="row" style="margin-top:8px"><div style="flex:2 1 200px"><label class="f">Nama manual</label><input id="erM" value="'+esc(r.vid?"":(r.nama||""))+'"></div>'+
  '<div><label class="f">Poin manual</label><input id="erP" type="number" value="'+(r.vid?0:(r.poin||0))+'"></div></div>'+
  '<label class="f" style="margin-top:8px">Catatan / Kronologi</label><textarea id="erN">'+esc(r.catatan||"")+'</textarea>'+
  '<div class="btns"><button class="btn" id="saveRec" data-r="'+id+'">Simpan</button><button class="btn sec" id="closeM">Batal</button></div>');
}

/* ============ LOGIN ============ */
function showLogin(){$("#login").style.display="flex";$("#lPass").value="";$("#lBak").value="";$("#lErr").textContent=""}
function enter(role){
  ROLE=role;sessionStorage.setItem("dps_role",role);$("#login").style.display="none";
  document.body.classList.toggle("viewer",role==="viewer");
  render();pull();
}
$("#lRole").addEventListener("change",function(){$("#lPw").style.display=this.value==="admin"?"block":"none"});
$("#lForgot").addEventListener("click",function(e){e.preventDefault();var w=$("#lBakW");w.style.display=w.style.display==="none"?"block":"none"});
$("#loginF").addEventListener("submit",function(e){
  e.preventDefault();var err=$("#lErr");err.textContent="";
  if($("#lRole").value==="viewer"){enter("viewer");return}
  var pw=$("#lPass").value, bk=$("#lBak").value;
  err.textContent="Memeriksa...";
  if(bk){
    sha(bk).then(function(h){
      if(h!==H_BAK){err.textContent="Password cadangan salah.";return}
      err.textContent="";enter("admin");
      setTimeout(function(){
        var n=prompt("Login dengan password cadangan berhasil. Masukkan password admin baru (min. 4 karakter):");
        if(n&&n.length>=4){setAdminPw(n);toast("Password admin berhasil diganti.")}
      },300);
    });return;
  }
  Promise.all([sha(pw),getAdminHash()]).then(function(a){
    if(a[0]===a[1]){err.textContent="";enter("admin")}else err.textContent="Password salah.";
  });
});
var savedRole=sessionStorage.getItem("dps_role");
if(savedRole==="admin"||savedRole==="viewer")enter(savedRole);else showLogin();
window.addEventListener("online",pull);
/* Tidak ada polling otomatis (hemat kuota read). Gunakan tombol Sinkron. */
document.addEventListener("click",function(e){if(e.target&&e.target.id==="syncBtn"){pull()}});
})();
</script>
